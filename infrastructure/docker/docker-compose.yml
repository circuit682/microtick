services:
  postgres:
    image: postgres:17

    container_name: microtick-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: microtick
      POSTGRES_PASSWORD: microtick
      POSTGRES_DB: microtick

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microtick"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: